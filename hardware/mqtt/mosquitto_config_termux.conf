# Mosquitto Broker Configuration for Termux Devices (Mesh Node)
# This is a template - device-specific IP should be set
# Location: ~/.config/mosquitto/mosquitto.conf

# General
pid_file /data/data/com.termux/files/usr/var/run/mosquitto.pid

# Persistence
persistence true
persistence_location /data/data/com.termux/files/usr/var/lib/mosquitto/
persistence_file mosquitto.db

# Logging
log_dest file /data/data/com.termux/files/usr/var/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true

# Network listeners
# Local only (for device-local clients)
listener 127.0.0.1 1883
protocol mqtt

# Device IP listener (for mesh connections)
# NOTE: Replace DEVICE_IP with actual device IP (192.168.8.101, 102, or 103)
listener DEVICE_IP 1883
protocol mqtt

# Security
allow_anonymous true

# Connection settings
max_connections 10
max_inflight_messages 20
max_queued_messages 100
max_queued_bytes 0

# Retained messages
retained_persistence true

# Bridge to router (primary broker)
connection router_bridge
address 192.168.8.1:1883
topic tetragrammatron/# out 0
topic tetragrammatron/# in 0
bridge_protocol_version mqttv311
try_private false
start_type automatic
notifications false
cleansession true

# Bridge to peer devices (optional - for full mesh)
# Uncomment and configure for each peer device
# connection peer_102
# address 192.168.8.102:1883
# topic tetragrammatron/# out 0
# topic tetragrammatron/# in 0
# bridge_protocol_version mqttv311
# try_private false
# start_type automatic
# notifications false
# cleansession true

# connection peer_103
# address 192.168.8.103:1883
# topic tetragrammatron/# out 0
# topic tetragrammatron/# in 0
# bridge_protocol_version mqttv311
# try_private false
# start_type automatic
# notifications false
# cleansession true

# Keepalive
keepalive_interval 60

# Auto-generate client IDs
auto_id_prefix termux_


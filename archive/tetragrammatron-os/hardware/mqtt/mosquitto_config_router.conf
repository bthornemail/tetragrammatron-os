# Mosquitto Broker Configuration for OpenWrt Router (Primary)
# Location: /etc/mosquitto/mosquitto.conf

# General
pid_file /var/run/mosquitto.pid
user mosquitto

# Persistence
persistence true
persistence_location /var/lib/mosquitto/
persistence_file mosquitto.db

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Network listeners
# MQTT protocol on port 1883
listener 1883 0.0.0.0
protocol mqtt

# WebSocket for browser clients on port 8080
listener 8080 0.0.0.0
protocol websockets
websockets_headers_size 1024

# Security (allow anonymous for now, can be configured later)
allow_anonymous true

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 0
message_expiry_interval 0

# Retained messages
retained_persistence true

# Bridge configuration (accept connections from Termux devices)
# Bridges are configured on the Termux devices, not here

# Topic patterns for Tetragrammatron
# Allow all topics matching: tetragrammatron/+/canbc/+
# This is handled by allow_anonymous true, but can be restricted with ACLs if needed

# ACL (Access Control List) - optional, uncomment to restrict access
# acl_file /etc/mosquitto/acl
# password_file /etc/mosquitto/passwd

# QoS settings
max_packet_size 0

# Keepalive
keepalive_interval 60

# Auto-generate client IDs
auto_id_prefix mosquitto_

